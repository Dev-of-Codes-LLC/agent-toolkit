name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# The org allows only GitHub-owned actions, so third-party tools are installed
# from their release tarballs, pinned to a version and a SHA-256.

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "${tarball}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan every commit
        run: gitleaks git --redact --verbose --exit-code 1 .

  validate:
    name: Plugin manifests
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_VERSION: 2.1.283
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate each plugin
        run: |
          for plugin in plugins/*/; do
            claude plugin validate "${plugin}"
          done

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    env:
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lychee
        working-directory: ${{ runner.temp }}
        run: |
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfLO "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${tarball}"
          echo "${LYCHEE_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "${tarball}" --strip-components=1 "lychee-x86_64-unknown-linux-gnu/lychee"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Check links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: lychee --no-progress --include-fragments './**/*.md'

  skills:
    name: Skill scripts on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: feature-doc renders a page
        run: |
          out="${RUNNER_TEMP}/sample.html"
          node plugins/dev-workflow/skills/feature-doc/scripts/render.mjs tests/feature-doc/sample.md "${out}"
          grep -q 'name="source-sha256"' "${out}"
      - name: docker-cleanup audit (read-only)
        shell: pwsh
        run: ./plugins/dev-workflow/skills/docker-cleanup/scripts/audit.ps1
      - name: docker-cleanup dry run (no -Execute)
        shell: pwsh
        run: ./plugins/dev-workflow/skills/docker-cleanup/scripts/cleanup.ps1 -Tier cache,builders,networks,containers,images
